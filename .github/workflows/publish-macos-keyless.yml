name: Publish signed Honest Father Mac delta

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag whose CI builds passed
                required: true
                type: string
            runId:
                description: Successful Build Honest Father run for that exact tag
                required: true
                type: string
            expectedManifestSHA:
                description: SHA-256 of the locally verified signed-app file manifest
                required: true
                type: string

permissions:
    contents: write
    actions: read

concurrency:
    group: publish-macos-keyless-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: macos-15
        timeout-minutes: 25
        env:
            GH_REPO: ${{ github.repository }}
            HF_TAG: ${{ inputs.tag }}
            HF_RUN_ID: ${{ inputs.runId }}
            HF_MANIFEST_SHA: ${{ inputs.expectedManifestSHA }}
        steps:
            - name: Validate dispatch input syntax
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$GH_REPO" == CyberKotletochka/Honest-Father ]]
                  [[ "$HF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  [[ "$HF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                  [[ "$HF_MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
            # Use the dispatch revision for the publication script; the target
            # tag predates this workflow. The script separately verifies the tag.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: npm
            - name: Verify tag, source commit, and successful CI builds
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/publish-macos-keyless.js validate
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: Honest-Father-darwin-arm64
                  path: work/keyless-publication-downloads/base
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.runId }}
                  digest-mismatch: error
            - name: Install the existing archive maker dependencies
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
              run: npm ci
            - name: Reconstruct the exact signed app, then make and verify ZIP and DMG
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/publish-macos-keyless.js prepare
            - name: Upload the three verified Mac release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/publish-macos-keyless.js publish
