name: Publish verified Honest Father builds

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to publish
                required: true
                type: string
            build_run_id:
                description: Build Honest Father run with both platform builds successful
                required: true
                type: string

permissions:
    contents: write
    actions: read

concurrency:
    group: publish-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: macos-15
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag }}
            - name: Verify tag and both completed builds
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  HF_TAG: ${{ inputs.tag }}
                  HF_BUILD_RUN: ${{ inputs.build_run_id }}
              run: |
                  set -euo pipefail
                  [[ "$HF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  [[ "$HF_BUILD_RUN" =~ ^[0-9]+$ ]]
                  gh api "repos/$GH_REPO/actions/runs/$HF_BUILD_RUN" > build-run.json
                  jq -e --arg tag "$HF_TAG" --arg sha "$(git rev-parse HEAD)" \
                      '.path == ".github/workflows/build.yml" and .name == "Build Honest Father" and .event == "push" and .head_branch == $tag and .head_sha == $sha' build-run.json
                  gh api "repos/$GH_REPO/actions/runs/$HF_BUILD_RUN/jobs?per_page=100" > build-jobs.json
                  jq -e '[.jobs[] | select(.name == "darwin / arm64" or .name == "win32 / x64")] | ((map(.name) | sort) == ["darwin / arm64", "win32 / x64"] and all(.status == "completed" and .conclusion == "success"))' build-jobs.json
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: Honest-Father-*
                  path: release-assets
                  merge-multiple: true
                  github-token: ${{ github.token }}
                  run-id: ${{ inputs.build_run_id }}
                  digest-mismatch: error
            - name: Verify download checksums
              working-directory: release-assets
              run: |
                  set -euo pipefail
                  shasum -a 256 -c *macos-arm64-SHA256SUMS.txt
                  shasum -a 256 -c *windows-x64-SHA256SUMS.txt
            - name: Publish complete release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  HF_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if ! gh release view "$HF_TAG" >/dev/null 2>&1; then
                      gh release create "$HF_TAG" --verify-tag --draft --title "Honest Father $HF_TAG" --notes-file RELEASE_NOTES.md
                  fi
                  gh release upload "$HF_TAG" release-assets/* --clobber
                  gh release edit "$HF_TAG" --draft=false --latest
